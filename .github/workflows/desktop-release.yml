name: Desktop release

on:
  push:
    tags: ['v0.1.4-desktop-test.5.mac.2']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  macos:
    runs-on: opendirector-local-mac
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Check release version and architecture
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./apps/desktop/package.json").version')"
          test "$(uname -m)" = arm64
      - name: Prepare build tools
        run: |
          command -v uv >/dev/null || brew install uv
          media="$RUNNER_TEMP/desktop-media"
          mkdir -p "$media"
          for tool in ffmpeg ffprobe; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/descriptinc/ffmpeg-ffprobe-static/releases/download/b6.1.2-rc.1/${tool}-darwin-arm64" \
              --output "$media/$tool"
            chmod +x "$media/$tool"
            "$media/$tool" -version
          done
          echo "OPENDIRECTOR_FFMPEG_DIR=$media" >> "$GITHUB_ENV"
      - name: Build desktop application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --prefix apps/desktop
          npm run prepare:runtime --prefix apps/desktop
          npm run pack --prefix apps/desktop
      - name: Build and smoke-test DMG
        run: |
          staging="$RUNNER_TEMP/desktop-dmg"
          mount="$RUNNER_TEMP/desktop-mount"
          mkdir -p "$staging" "$mount" release-assets
          ditto apps/desktop/build/mac-arm64/OpenDirector.app "$staging/OpenDirector.app"
          ln -s /Applications "$staging/Applications"
          dmg="OpenDirector-${RELEASE_TAG}-mac-arm64-unsigned.dmg"
          hdiutil create -volname OpenDirector -srcfolder "$staging" -format UDZO "release-assets/$dmg"
          hdiutil attach "release-assets/$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          node apps/desktop/scripts/smoke.mjs "$mount/OpenDirector.app/Contents/MacOS/OpenDirector"
          cd release-assets
          shasum -a 256 "$dmg" > "${dmg}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-dmg
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
