name: Desktop release (local macOS)

on:
  push:
    tags: ['v0.1.4-desktop-test.14']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  macos:
    if: github.repository == 'FayeSpica/OpenDirector'
    runs-on: opendirector-local-mac
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Check release version and architecture
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          if [[ "$GITHUB_REPOSITORY" == "ThinkFlowLab/OpenDirector" ]]; then
            test "$RELEASE_TAG" = "v$version"
          else
            [[ "$RELEASE_TAG" = "v$version" || "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-desktop-test\.[0-9]+$ && "${RELEASE_TAG%-desktop-test.*}" = "v$version" ]]
          fi
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
      - name: Prepare build tools
        run: |
          command -v uv >/dev/null || brew install uv
          cache="$RUNNER_TOOL_CACHE/opendirector-media/b6.1.2-rc.1/arm64"
          media="$RUNNER_TEMP/desktop-media"
          mkdir -p "$media"
          for tool in ffmpeg ffprobe; do
            if [ -x "$cache/$tool" ]; then
              cp "$cache/$tool" "$media/$tool"
            else
              curl --fail --silent --show-error --location --retry 3 \
                "https://github.com/descriptinc/ffmpeg-ffprobe-static/releases/download/b6.1.2-rc.1/${tool}-darwin-arm64" \
                --output "$media/$tool"
              chmod +x "$media/$tool"
            fi
            "$media/$tool" -version
          done
          echo "OPENDIRECTOR_FFMPEG_DIR=$media" >> "$GITHUB_ENV"
      - name: Build desktop application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --prefix apps/desktop
          npm run prepare:runtime --prefix apps/desktop
          npm run pack --prefix apps/desktop
      - name: Build and smoke-test DMG
        run: |
          staging="$RUNNER_TEMP/desktop-dmg"
          mount="$RUNNER_TEMP/desktop-mount"
          mkdir -p "$staging" "$mount" release-assets
          ditto apps/desktop/build/mac-arm64/OpenDirector.app "$staging/OpenDirector.app"
          ln -s /Applications "$staging/Applications"
          dmg="OpenDirector-v${DESKTOP_VERSION}-mac-arm64-unsigned.dmg"
          hdiutil create -volname OpenDirector -srcfolder "$staging" -format UDZO "release-assets/$dmg"
          hdiutil attach "release-assets/$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          node apps/desktop/scripts/smoke.mjs "$mount/OpenDirector.app/Contents/MacOS/OpenDirector"
          cd release-assets
          shasum -a 256 "$dmg" > "${dmg}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-dmg
          path: release-assets/
          compression-level: 0
          if-no-files-found: error

  prepare-release:
    if: github.repository == 'FayeSpica/OpenDirector'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Find or create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          draft=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          case "$draft" in
            true) ;;
            '') gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes ;;
            *) echo "::error::Release $RELEASE_TAG is already published"; exit 1 ;;
          esac

  release-macos:
    needs: [prepare-release, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-dmg
          path: release-assets
      - name: Attach verified installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
